version: 2
project_name: acloud

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X main.Version={{.Version}}
    main: .

archives:
  - formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "acloud_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

nfpms:
  - package_name: acloud
    homepage: https://github.com/Arubacloud/acloud-cli
    maintainer: Aruba <support@aruba.it>
    description: Official CLI for Aruba Cloud — manage cloud resources from the terminal
    license: Apache-2.0
    formats:
      - deb
      - rpm
    contents:
      - src: ./LICENSE
        dst: /usr/share/doc/acloud/LICENSE

brews:
  - name: acloud
    repository:
      owner: Arubacloud
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: https://github.com/Arubacloud/acloud-cli
    description: Official CLI for Aruba Cloud — manage cloud resources from the terminal
    license: Apache-2.0
    install: |
      bin.install "acloud"
    test: |
      system "#{bin}/acloud", "--version"

scoops:
  - repository:
      owner: Arubacloud
      name: scoop-bucket
      token: "{{ .Env.SCOOP_TAP_GITHUB_TOKEN }}"
    homepage: https://github.com/Arubacloud/acloud-cli
    description: Official CLI for Aruba Cloud — manage cloud resources from the terminal
    license: Apache-2.0

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

release:
  github:
    owner: Arubacloud
    name: acloud-cli
  draft: false
  prerelease: auto
  name_template: "v{{ .Version }}"
