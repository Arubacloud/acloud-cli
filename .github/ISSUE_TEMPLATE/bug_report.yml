name: Bug Report
description: Report a bug or unexpected behaviour in acloud-cli
title: "[bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill in as much detail as possible.

  - type: input
    id: version
    attributes:
      label: acloud-cli version
      description: Run `acloud version` and paste the output.
      placeholder: "e.g. v0.2.0"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug, including any error messages.
      placeholder: "When I run `acloud ...`, I get ..."
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
      placeholder: "I expected ..."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal steps needed to trigger the bug.
      placeholder: |
        1. Run `acloud ...`
        2. See error
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: Relevant configuration / environment
      description: Paste sanitised config or env vars if relevant. **Do not include secrets.**
      render: yaml

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Logs, screenshots, or anything else that might help.
