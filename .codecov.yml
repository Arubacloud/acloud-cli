coverage:
  precision: 2
  round: down
  range: "70...100"

  status:
    project:
      default:
        target: auto
        threshold: 1%   # allow up to 1% drop before failing
    patch:
      default:
        target: 70%     # Args/Operation/Run refactoring patches: parse methods have
                        # systematic defensive error branches for impossible flag-read
                        # failures (flags always registered in init()) that cannot be
                        # covered by unit tests without mocking cobra internals.
        threshold: 2%
